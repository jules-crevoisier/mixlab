[package]
name = "mixlab"
version = "0.3.0"
description = "Logiciel DJ qui apprend à mixer"
edition = "2021"
publish = false

[lib]
name = "mixlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
